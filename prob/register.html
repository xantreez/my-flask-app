<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Рӯйхатгирӣ</h2>
        <p class="subtitle">Ҳисоби нав эҷод кунед</p>
        
        <form action="asdsa" method="POST">
            <div class="input-group">
                <input type="email" name="email" required placeholder=" ">
                <label>Email</label>
            </div>
            <div class="input-group">
                <input type="password" name="password" required placeholder=" ">
                <label>Password</label>
            </div>
            <button type="submit" class="btn">Рӯйхатгирӣ</button>
        </form>

        <p class="footer-text">
            Аккаунт доред? <a href="login.html">Login</a>
        </p>
    </div>
</body>
</html>
